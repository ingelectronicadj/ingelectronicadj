<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 164" width="480" height="164" role="img" aria-label="Scanner: Auditoría y monitoreo continuo de accesibilidad web">
<title>Scanner</title>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d1b4a"/><stop offset="1" stop-color="#070f2e"/></linearGradient>
  <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#22D3EE" stop-opacity="0"/><stop offset=".5" stop-color="#22D3EE" stop-opacity=".9"/><stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
  </linearGradient>
  <clipPath id="c"><rect x="0" y="0" width="480" height="164" rx="16"/></clipPath>
</defs>
<style>
  text{font-family:'Segoe UI', system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif}
  .sweep{animation:sweep 5s 0s ease-in-out infinite}
  @keyframes sweep{0%{transform:translateX(-480px)}60%,100%{transform:translateX(480px)}}
  .ic{fill:none;stroke:#22D3EE;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .knob{fill:#0d1b4a}
  @media (prefers-reduced-motion: reduce){*{animation:none !important}}
</style>
<g clip-path="url(#c)">
  <rect width="480" height="164" fill="url(#bg)"/>
  <rect class="sweep" x="0" y="0" width="480" height="3" fill="url(#sheen)"/>
  <rect x="0" y="0" width="5" height="164" fill="#22D3EE" opacity=".9"/>
  <circle cx="460" cy="154" r="90" fill="#22D3EE" opacity=".08"/>
</g>
<rect x=".75" y=".75" width="478.5" height="162.5" rx="15.5" fill="none" stroke="#22D3EE" stroke-opacity=".35" stroke-width="1.5"/>
<rect x="28" y="24" width="48" height="48" rx="13" fill="#22D3EE" fill-opacity=".16" stroke="#22D3EE" stroke-opacity=".5"/>
<g class="ic" transform="translate(40 36)"><circle cx="10" cy="10" r="6"/><path d="M15 15l6 6"/></g>
<text x="92" y="57" font-size="23" font-weight="800" fill="#FFFFFF">Scanner</text>
<text x="28" y="102" font-size="15.5" fill="#C3CEEE"><tspan x="28" dy="0">Auditoría y monitoreo continuo de accesibilidad web</tspan></text>
<text x="28" y="146" font-size="15" font-weight="700" fill="#22D3EE">Abrir Scanner →</text>
</svg>
