<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 330" width="480" height="330" role="img" aria-label="GitHub en números">
<title>GitHub en números</title>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d1b4a"/><stop offset="1" stop-color="#070f2e"/></linearGradient>
  <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#22D3EE" stop-opacity="0"/><stop offset=".5" stop-color="#22D3EE" stop-opacity=".9"/><stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
  </linearGradient>
  <clipPath id="c"><rect width="480" height="330" rx="16"/></clipPath>
</defs>
<style>
  text{font-family:'Segoe UI', system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif}
  .sweep{animation:sweep 5s ease-in-out infinite}
  .bar{transform-box:fill-box;transform-origin:left center;animation:grow 1.1s ease-out both}
  @keyframes sweep{0%{transform:translateX(-480px)}60%,100%{transform:translateX(480px)}}
  @keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
  .ic{fill:none;stroke:#22D3EE;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  @media (prefers-reduced-motion: reduce){*{animation:none !important}}
</style>
<g clip-path="url(#c)">
  <rect width="480" height="330" fill="url(#bg)"/>
  <rect class="sweep" width="480" height="3" fill="url(#sheen)"/>
  <rect width="5" height="330" fill="#22D3EE" opacity=".9"/>
  <circle cx="460" cy="320" r="110" fill="#22D3EE" opacity=".07"/>
</g>
<rect x=".75" y=".75" width="478.5" height="328.5" rx="15.5" fill="none" stroke="#22D3EE" stroke-opacity=".35" stroke-width="1.5"/>
<rect x="28" y="24" width="48" height="48" rx="13" fill="#22D3EE" fill-opacity=".16" stroke="#22D3EE" stroke-opacity=".5"/>
<g class="ic" transform="translate(40 36)"><path d="M4 20V10M10 20V4M16 20v-8M22 20H2"/></g>
<text x="92" y="46" font-size="22" font-weight="800" fill="#FFFFFF">GitHub en números</text>
<text x="92" y="66" font-size="13.5" fill="#C3CEEE">Resumen de mi actividad pública</text>
<rect x="28" y="98" width="204" height="82" rx="12" fill="#22D3EE" fill-opacity=".08" stroke="#22D3EE" stroke-opacity=".3"/><text x="46" y="148" font-size="42" font-weight="800" fill="#22D3EE">42</text><text x="46" y="170" font-size="14" fill="#DDE5FF">proyectos propios</text><rect x="248" y="98" width="204" height="82" rx="12" fill="#FBBF24" fill-opacity=".08" stroke="#FBBF24" stroke-opacity=".3"/><text x="266" y="148" font-size="42" font-weight="800" fill="#FBBF24">18</text><text x="266" y="170" font-size="14" fill="#DDE5FF">estrellas recibidas</text><rect x="28" y="198" width="204" height="82" rx="12" fill="#A78BFA" fill-opacity=".08" stroke="#A78BFA" stroke-opacity=".3"/><text x="46" y="248" font-size="42" font-weight="800" fill="#A78BFA">26</text><text x="46" y="270" font-size="14" fill="#DDE5FF">seguidores</text><rect x="248" y="198" width="204" height="82" rx="12" fill="#34D399" fill-opacity=".08" stroke="#34D399" stroke-opacity=".3"/><text x="266" y="248" font-size="42" font-weight="800" fill="#34D399">12</text><text x="266" y="270" font-size="14" fill="#DDE5FF">años en GitHub</text>
<text x="28" y="310" font-size="12.5" fill="#9FB0D8">Datos públicos de GitHub · octubre de 2026</text>
</svg>
