<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" width="320" height="220" role="img" aria-label="freespeech: Sistema Aumentativo y Alternativo de Comunicación (SAAC) en Vue 3 con copiado de texto plano y ventana flotante para Moodle.">
<title>freespeech</title>
<defs>
