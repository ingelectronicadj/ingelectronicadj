<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 330" width="480" height="330" role="img" aria-label="Lenguajes más usados">
<title>Lenguajes más usados</title>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d1b4a"/><stop offset="1" stop-color="#070f2e"/></linearGradient>
  <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#A78BFA" stop-opacity="0"/><stop offset=".5" stop-color="#A78BFA" stop-opacity=".9"/><stop offset="1" stop-color="#A78BFA" stop-opacity="0"/>
  </linearGradient>
  <clipPath id="c"><rect width="480" height="330" rx="16"/></clipPath>
</defs>
<style>
  text{font-family:'Segoe UI', system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif}
  .sweep{animation:sweep 5s ease-in-out infinite}
  .bar{transform-box:fill-box;transform-origin:left center;animation:grow 1.1s ease-out both}
  @keyframes sweep{0%{transform:translateX(-480px)}60%,100%{transform:translateX(480px)}}
  @keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
  .ic{fill:none;stroke:#A78BFA;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  @media (prefers-reduced-motion: reduce){*{animation:none !important}}
</style>
<g clip-path="url(#c)">
  <rect width="480" height="330" fill="url(#bg)"/>
  <rect class="sweep" width="480" height="3" fill="url(#sheen)"/>
  <rect width="5" height="330" fill="#A78BFA" opacity=".9"/>
  <circle cx="460" cy="320" r="110" fill="#A78BFA" opacity=".07"/>
</g>
<rect x=".75" y=".75" width="478.5" height="328.5" rx="15.5" fill="none" stroke="#A78BFA" stroke-opacity=".35" stroke-width="1.5"/>
<rect x="28" y="24" width="48" height="48" rx="13" fill="#A78BFA" fill-opacity=".16" stroke="#A78BFA" stroke-opacity=".5"/>
<g class="ic" transform="translate(40 36)"><path d="M8 7l-5 5 5 5M16 7l5 5-5 5M14 4l-4 16"/></g>
<text x="92" y="46" font-size="22" font-weight="800" fill="#FFFFFF">Lenguajes más usados</text>
<text x="92" y="66" font-size="13.5" fill="#C3CEEE">Por número de proyectos propios</text>
<text x="28" y="118" font-size="14" fill="#FFFFFF">JavaScript</text><rect x="128" y="108" width="250" height="12" rx="6" fill="#FFFFFF" fill-opacity=".1"/><rect class="bar" x="128" y="108" width="250" height="12" rx="6" fill="#F1E05A" style="animation-delay:0.00s"/><text x="452" y="119" font-size="14" font-weight="700" fill="#DDE5FF" text-anchor="end">9</text><text x="28" y="149" font-size="14" fill="#FFFFFF">Arduino</text><rect x="128" y="139" width="250" height="12" rx="6" fill="#FFFFFF" fill-opacity=".1"/><rect class="bar" x="128" y="139" width="167" height="12" rx="6" fill="#22B5BC" style="animation-delay:0.08s"/><text x="452" y="150" font-size="14" font-weight="700" fill="#DDE5FF" text-anchor="end">6</text><text x="28" y="180" font-size="14" fill="#FFFFFF">Python</text><rect x="128" y="170" width="250" height="12" rx="6" fill="#FFFFFF" fill-opacity=".1"/><rect class="bar" x="128" y="170" width="139" height="12" rx="6" fill="#4F9BD9" style="animation-delay:0.16s"/><text x="452" y="181" font-size="14" font-weight="700" fill="#DDE5FF" text-anchor="end">5</text><text x="28" y="211" font-size="14" fill="#FFFFFF">C++</text><rect x="128" y="201" width="250" height="12" rx="6" fill="#FFFFFF" fill-opacity=".1"/><rect class="bar" x="128" y="201" width="111" height="12" rx="6" fill="#F34B7D" style="animation-delay:0.24s"/><text x="452" y="212" font-size="14" font-weight="700" fill="#DDE5FF" text-anchor="end">4</text><text x="28" y="242" font-size="14" fill="#FFFFFF">MATLAB</text><rect x="128" y="232" width="250" height="12" rx="6" fill="#FFFFFF" fill-opacity=".1"/><rect class="bar" x="128" y="232" width="56" height="12" rx="6" fill="#E16737" style="animation-delay:0.32s"/><text x="452" y="243" font-size="14" font-weight="700" fill="#DDE5FF" text-anchor="end">2</text><text x="28" y="273" font-size="14" fill="#FFFFFF">Processing</text><rect x="128" y="263" width="250" height="12" rx="6" fill="#FFFFFF" fill-opacity=".1"/><rect class="bar" x="128" y="263" width="56" height="12" rx="6" fill="#2FB0E8" style="animation-delay:0.40s"/><text x="452" y="274" font-size="14" font-weight="700" fill="#DDE5FF" text-anchor="end">2</text>
<text x="28" y="310" font-size="12.5" fill="#9FB0D8">También: Shell, PHP, CSS y VBA</text>
</svg>
