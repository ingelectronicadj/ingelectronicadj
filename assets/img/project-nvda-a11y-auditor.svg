<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" width="320" height="220" role="img" aria-label="nvda-a11y-auditor: Auditor lineal de Web Desktop con NVDA y Chrome CDP, sondas de carga y controles compuestos, W3C ACCNAME 1.2 y reportes interactivos WCAG 2.2.">
<title>nvda-a11y-auditor</title>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d1b4a"/><stop offset="1" stop-color="#070f2e"/></linearGradient>
  <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#FBBF24" stop-opacity="0"/><stop offset=".5" stop-color="#FBBF24" stop-opacity=".9"/><stop offset="1" stop-color="#FBBF24" stop-opacity="0"/>
  </linearGradient>
  <clipPath id="c"><rect width="320" height="220" rx="16"/></clipPath>
</defs>
<style>
  text{font-family:'Segoe UI', system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif}
  .sweep{animation:sweep 5s .15s ease-in-out infinite}
  @keyframes sweep{0%{transform:translateX(-320px)}60%,100%{transform:translateX(320px)}}
  .ic{fill:none;stroke:#FBBF24;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  @media (prefers-reduced-motion: reduce){*{animation:none !important}}
</style>
<g clip-path="url(#c)">
  <rect width="320" height="220" fill="url(#bg)"/>
  <rect class="sweep" width="320" height="3" fill="url(#sheen)"/>
  <rect width="5" height="220" fill="#FBBF24" opacity=".9"/>
  <circle cx="300" cy="210" r="80" fill="#FBBF24" opacity=".07"/>
</g>
<rect x=".75" y=".75" width="318.5" height="218.5" rx="15.5" fill="none" stroke="#FBBF24" stroke-opacity=".35" stroke-width="1.5"/>

<g class="ic" transform="translate(24 20)">
  <rect x="2" y="2" width="16" height="11" rx="2"/><path d="M6 17h8M10 13v4"/>
</g>
<text x="50" y="34" font-size="16.5" font-weight="800" fill="#FFFFFF">nvda-a11y-auditor</text>

<circle cx="28" cy="62" r="4.5" fill="#F59E0B"/>
<text x="38" y="66" font-size="12" font-weight="600" fill="#DDE5FF">Python · NVDA · Chrome CDP</text>
<text x="296" y="66" font-size="12" font-weight="600" fill="#9FB0D8" text-anchor="end">v0.6.2 · 16 reglas</text>

<text x="24" y="96" font-size="13" fill="#C3CEEE"><tspan x="24" dy="0">Auditor lineal de Web Desktop NVDA con</tspan><tspan x="24" dy="20">cursor virtual y foco vía Chrome CDP,</tspan><tspan x="24" dy="20">sondas ARIA/loading y reporte HTML.</tspan></text>

<text x="24" y="196" font-size="13.5" font-weight="700" fill="#FBBF24">Ver repositorio →</text>
</svg>
