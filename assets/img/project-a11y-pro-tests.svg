<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" width="320" height="220" role="img" aria-label="a11y-pro-tests: Suite interactiva de 21 bookmarklets de auditoría WCAG 2.2 agrupados por principios POUR y laboratorio en vivo (tests.a11ypro.tech).">
<title>a11y-pro-tests</title>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d1b4a"/><stop offset="1" stop-color="#070f2e"/></linearGradient>
  <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#818CF8" stop-opacity="0"/><stop offset=".5" stop-color="#818CF8" stop-opacity=".9"/><stop offset="1" stop-color="#818CF8" stop-opacity="0"/>
  </linearGradient>
  <clipPath id="c"><rect width="320" height="220" rx="16"/></clipPath>
</defs>
<style>
  text{font-family:'Segoe UI', system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif}
  .sweep{animation:sweep 5s .35s ease-in-out infinite}
  @keyframes sweep{0%{transform:translateX(-320px)}60%,100%{transform:translateX(320px)}}
  .ic{fill:none;stroke:#818CF8;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  @media (prefers-reduced-motion: reduce){*{animation:none !important}}
</style>
<g clip-path="url(#c)">
  <rect width="320" height="220" fill="url(#bg)"/>
  <rect class="sweep" width="320" height="3" fill="url(#sheen)"/>
  <rect width="5" height="220" fill="#818CF8" opacity=".9"/>
  <circle cx="300" cy="210" r="80" fill="#818CF8" opacity=".07"/>
</g>
<rect x=".75" y=".75" width="318.5" height="218.5" rx="15.5" fill="none" stroke="#818CF8" stroke-opacity=".35" stroke-width="1.5"/>

<g class="ic" transform="translate(24 20)">
  <path d="M5 2h10a1 1 0 0 1 1 1v15l-6-3.5L4 18V3a1 1 0 0 1 1-1Z"/>
</g>
<text x="50" y="34" font-size="16.5" font-weight="800" fill="#FFFFFF">a11y-pro-tests</text>

<circle cx="28" cy="62" r="4.5" fill="#6366F1"/>
<text x="38" y="66" font-size="12" font-weight="600" fill="#DDE5FF">JS · 21 Bookmarklets · POUR</text>
<text x="296" y="66" font-size="12" font-weight="600" fill="#9FB0D8" text-anchor="end">v1.16.0 · GitLab</text>

<text x="24" y="96" font-size="13" fill="#C3CEEE"><tspan x="24" dy="0">Suite de 21 inspectores WCAG 2.2 en un</tspan><tspan x="24" dy="20">bookmarklet (Reflow 320px, Contraste,</tspan><tspan x="24" dy="20">Foco, Live Regions) y lab interactivo.</tspan></text>

<text x="24" y="196" font-size="13.5" font-weight="700" fill="#818CF8">Ver en GitLab →</text>
</svg>
