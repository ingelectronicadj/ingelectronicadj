<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 8" width="1000" height="8" role="presentation" aria-hidden="true">
<defs>
  <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#2F81F7" stop-opacity="0"/><stop offset=".25" stop-color="#2F81F7"/>
    <stop offset=".6" stop-color="#8B5CF6"/><stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="s" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".9"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
  </linearGradient>
</defs>
<style>
  .s{animation:s 6s ease-in-out infinite}
  @keyframes s{0%{transform:translateX(-300px)}70%,100%{transform:translateX(1000px)}}
  @media (prefers-reduced-motion: reduce){*{animation:none !important}}
</style>
<rect y="2" width="1000" height="4" rx="2" fill="url(#g)"/>
<rect class="s" y="2" width="300" height="4" rx="2" fill="url(#s)" opacity=".7"/>
</svg>
